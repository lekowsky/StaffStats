# StaffStats v1.6.1 - Purpur 1.21.10
# /staff - GUI z główkami (+ /staff top, kary z LibertyBans, cykl tygodniowy)
# Autor: KadraStats
# https://github.com/

# === AUTO-UPDATE CONFIG ===
# true = po wgraniu nowego JARa automatycznie dopisze brakujące opcje do config.yml
# robi backup: config.yml.backup-YYYYMMDD-HHMMSS
config-auto-update: true
# UWAGA: true = CAŁKOWICIE nadpisze config.yml plikiem z JARa przy starcie (zrobi backup!)
# Ustaw na true tylko jeśli chcesz zresetować config do domyślnego
config-force-overwrite: false

# Rangi LuckPerms do śledzenia
tracked-groups:
  - "wlasciciel"
  - "headadmin"
  - "admin"
  - "mod"
  - "moderator"
  - "kidmod"
  - "helper"
  - "pomocnik"
  - "jrhelper"
  - "architekt"
  - "builder"

# Priorytet sortowania (wyższy = wyżej w GUI)
# używane też do sortowania głów w GUI – pobierane z LuckPerms primary group
group-priority:
  wlasciciel: 100
  headadmin: 90
  admin: 80
  moderator: 70
  mod: 70
  kidmod: 65
  helper: 60
  pomocnik: 60
  jrhelper: 50
  architekt: 40
  builder: 40
  default: 10

track-only-listed-groups: true

# GUI
gui:
  title: "&8&lKADRA &7- Statystyki"
  rows: 6
  # true = każde otwarcie GUI czyta świeże dane z bazy
  # false = używa cache do 5s (mniejsze obciążenie przy spamie /staff)
  refresh-on-open: true
  # true = pokazuj też osoby offline; false = tylko aktualnie online
  show-offline-heads: true
  # Live-refresh otwartego GUI w sekundach (0 = wyłączony)
  live-refresh-seconds: 5
  # click = pełny raport na chacie
  click-to-report: true

integrations:
  luckperms: true
  essentials-afk: true
  # Wbudowany detektor AFK (fallback gdy NIE masz EssentialsX).
  # Aktywny tylko gdy hook EssentialsX nie działa (ustaw essentials-afk: false aby go wymusić).
  internal-afk-detector: false
  # Po ilu minutach bezruchu oznaczyć kadrę jako AFK
  internal-afk-timeout-minutes: 10

# === LibertyBans – statystyki kar kadry ===
# Zlicza kary WYDANE przez śledzoną kadrę (mute/kick/warn/ban) - event PostPunishEvent.
# Liczone są WSZYSTKIE typy niezależnie od rangi (dane nie psują się przy zmianie rangi),
# a poniższa mapa kontroluje tylko CO jest WYŚWIETLANE danej rangi.
libertybans:
  enabled: true
  # Widok kar per ranga. Dostępne typy: mute, kick, warn, ban
  group-punishment-view:
    helper: ["mute", "kick"]
    kidmod: ["mute", "kick", "ban"]
    moderator: ["mute", "kick", "ban"]
    admin: ["mute", "kick", "ban"]
    headadmin: ["mute", "kick", "ban", "warn"]
    wlasciciel: ["mute", "kick", "ban", "warn"]
    # rangi niewymienione powyżej używają "default" (puste = bez statystyk kar)
    default: []

# === CYKL TYGODNIOWY (1.6.0+) ===
# Co interval-days dni plugin automatycznie:
#   1) doliczy trwające sesje i poczeka na zapis do bazy,
#   2) wyśle webhook z podsumowaniem tygodnia (TOP aktywność, TOP kary, nieobecni),
#   3) zarchiwizuje tydzień w tabeli staff_weeks (historia zostaje!),
#   4) wyczyści CAŁY postęp kadry (czasy, sesje, AFK, kary),
#   5) opcjonalnie zrestartuje serwer (restart-command).
# Kotwica cyklu jest w bazie (staff_meta) - jeśli serwer był wyłączony w terminie,
# reset dogoni cykl po starcie. Godzina at-hour:at-minute (Europe/Warsaw) przesuwa
# reset na najbliższe okno po upływie interwału.
weekly-reset:
  enabled: true
  # co ile dni (minimum 1)
  interval-days: 7
  # docelowa godzina resetu (0-23)
  at-hour: 4
  # docelowa minuta (0-59)
  at-minute: 0
  # czy zrestartować serwer po resecie (zalecane)
  restart-server: true
  # komenda restartu wykonana z konsoli (np. "restart" albo "stop")
  restart-command: "restart"
  # czy wysłać webhook z podsumowaniem tygodnia PRZED resem (zalecane)
  send-webhook: true

# Discord Webhook
# Dzienny raport + podsumowanie tygodnia (weekly-reset)
webhook:
  enabled: false
  # Wklej URL webhooka z Discorda tutaj:
  url: "https://discord.com/api/webhooks/TWOJE_ID/TWOJ_TOKEN"
  username: "StaffStats"
  avatar-url: "https://i.imgur.com/8Km9tLL.png"
  # Wyłączone - tylko daily summary
  send-on-staff-join: false
  send-on-staff-quit: false
  # Podsumowanie dzienne o danej godzinie (Europe/Warsaw), -1 = wyłącz
  daily-summary-hour: 22
  daily-summary-minute: 0
  # Minimalna długość sesji żeby wysłać quit webhook (minuty)
  min-quit-session-minutes: 5
  # Kolor embedów
  color-join: 65280
  color-quit: 16711680

storage:
  type: sqlite
  async-writes: true
  # Co ile minut dopisywać czas online do bazy (ochrona przed utratą danych
  # przy crash serwera; 0 = wyłączone). Zalecane: 15.
  periodic-save-minutes: 15

performance:
  luckperms-cache-ms: 30000
  command-cooldown-seconds: 2
  max-top-results: 54
  min-session-seconds: 30

notifications:
  staff-join-notify: false
  staff-quit-notify: false
  notify-permission: "staffstats.notify"
  respect-vanish: true

security:
  # Logowanie anomalii statystyk do konsoli (przycięte sesje, ujemne czasy, AFK > sesja)
  anti-cheat-logging: true
  max-session-hours: 24
  enable-bypass-permission: true

messages:
  prefix: "&8[&bStaffStats&8] &7"
  no-permission: "&cBrak uprawnień."
  player-not-tracked: "&cTen gracz nie jest w kadrze."
  gui-opening: "&7Otwieram panel kadry..."
  report-header: "&8&m--------&r &b&lRAPORT &8&m--------"
  top-header: "&8&m----------&r &b&lTOP KADRY &8&m----------"
