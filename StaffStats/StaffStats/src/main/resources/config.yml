# ============================================================
#  StaffStats v1.6.0 — konfiguracja
#  /staff, /staff top, /staff weekly reset|status, /staff reload
# ============================================================

# Co ile minut statystyki online są zapisywane do bazy
save-interval-minutes: 5

# Które grupy są traktowane jako kadra (LuckPerms)
tracked-groups:
  - helper
  - kidmod
  - mod
  - admin
  - headadmin
  - wlasciciel

# Kolejność/priorytet grup przy wyświetlaniu (wyższa = wyżej)
group-priority:
  wlasciciel: 100
  headadmin: 90
  admin: 80
  mod: 60
  kidmod: 50
  helper: 40

# Po ilu minutach braku aktywności gracz jest oznaczany jako AFK
afk-threshold-minutes: 5

# Wygląd GUI
gui:
  title: "Statystyki Kadry"
  size: 54
  live-refresh-seconds: 10

# Webhook Discord (dzienny raport aktywności + podsumowanie tygodnia)
webhook:
  enabled: false
  url: ""
  username: "StaffStats"
  avatar: ""
  # Codzienny raport o której godzinie (0-23, strefa Europe/Warsaw)
  daily-summary-hour: 21

# LibertyBans — liczniki kar (mute/kick/warn/ban)
libertybans:
  enabled: true
  # Które typy kar widzi dana ranga (widok dostosowany do uprawnień)
  group-punishment-view:
    default: [mute, kick]
    helper: [mute, kick]
    kidmod: [mute, kick, ban]
    mod: [mute, kick, ban]
    admin: [mute, kick, ban, warn]
    headadmin: [mute, kick, ban, warn]
    wlasciciel: [mute, kick, ban, warn]

# ===== CYKL TYGODNIOWY =====
# Automatyczny reset CAŁEGO postępu kadry (czasy, sesje, AFK, kary)
# co interval-days dni + restart serwera + webhook z podsumowaniem
# tygodnia (TOP aktywność, TOP kary, nieobecni). Historia zapisuje
# się w tabeli staff_weeks (archiwum tygodni).
weekly-reset:
  enabled: true
  # Co ile dni odbywa się reset (minimum 1)
  interval-days: 7
  # O której godzinie (strefa Europe/Warsaw) — reset przesuwa się
  # na najbliższą pełną godzinę at-hour:at-minute po upływie interwału
  at-hour: 4
  at-minute: 0
  # Czy po resecie zrestartować serwer (zalecane — czyści np. cache)
  restart-server: true
  # Komenda restartu wykonana z konsoli (np. "restart" / "stop")
  restart-command: "restart"
  # Czy wysłać webhook z podsumowaniem tygodnia PRZED resem (zalecane)
  send-webhook: true

# Automatyczna aktualizacja configu przy nowszej wersji pluginu
config-auto-update: true
